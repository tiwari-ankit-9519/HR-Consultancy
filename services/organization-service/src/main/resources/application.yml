server:
  port: 8081

spring:
  application:
    name: organization-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hr_platform}
    username: ${DB_USERNAME:hr_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences:
            - ${JWT_AUDIENCE}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    schemas: organization
    default-schema: organization
    create-schemas: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  logging:
    http-bodies-enabled: true
