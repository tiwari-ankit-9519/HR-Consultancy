spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/hr_platform_test}
    username: ${DB_USERNAME:hr_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    schemas: organization
    default-schema: organization
    create-schemas: true

logging:
  level:
    root: WARN
