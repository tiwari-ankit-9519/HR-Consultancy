spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/hr_platform_test}
    username: ${DB_USERNAME:hr_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/hr-platform}
          audiences:
            - ${JWT_AUDIENCE:hr-platform-api}

  flyway:
    enabled: true
    schemas: organization
    default-schema: organization
    create-schemas: true

logging:
  level:
    root: WARN
