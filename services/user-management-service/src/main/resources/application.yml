server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: user-management-service

  # PostgreSQL database configuration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA and Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: user_management

  # Database migration management
  flyway:
    enabled: true
    schemas: user_management
    default-schema: user_management
    locations: classpath:db/migration

  # JWT validation using Keycloak
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences:
            - ${JWT_AUDIENCE}

# Health and application information endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info

# Application-specific configuration
app:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL}
    realm: ${KEYCLOAK_REALM:hr-platform}
    client-id: ${KEYCLOAK_SERVICE_CLIENT_ID}
    client-secret: ${KEYCLOAK_SERVICE_CLIENT_SECRET}

  logging:
    http-bodies-enabled: true
